# Reference contract — code-review-brief (CON-07; RESEARCH Example 7).
# Compile a code-review brief from a PR-style doc + related context.
# Anchored to a meeting doc as pr_doc_id (no PR fixture exists yet in
# the Atlas Robotics fixture; the contract takes any DocId, so any doc
# works — eval scenarios will use a build-review meeting doc).
# See docs/v2/adr/006-task-contract-dsl.md §Decision 12.
version: 1
name: code-review-brief
description: |
  Compile a code-review brief from a PR-style doc + related context found
  via hybrid search. Useful for asynchronous review where the reviewer
  needs both the change description and the prior-art surface.
inputs:
  pr_doc_id:
    $ref: "#/types/DocId"
    description: DocId of the PR-style doc to review.
  search_query:
    type: string
    description: Hybrid-search query that surfaces related context.
required: [pr_doc_id, search_query]
sources:
  default_source:
    handle: "obsidian-fs://test-vault"
    required: true
sinks:
  default_sink:
    handle: "_memory/_briefs"
    required: true
assembly:
  - as: pr
    verb: read_note
    args:
      doc_id: "{{inputs.pr_doc_id}}"
  - as: related
    verb: search_hybrid
    args:
      query: "{{inputs.search_query}}"
      top_k: 10
  - as: compiled
    verb: compile_brief
    args:
      vault: test-vault
      target: "{{inputs.pr_doc_id}}--review"
      source_doc_ids: "{{related.doc_ids}}"
      purpose: "Code review brief"
      max_tokens: 2000
output_shape:
  type: object
  properties:
    steps:
      type: object
    write_back:
      type: object
      properties:
        doc_id:
          type: string
      required: [doc_id]
  required: [write_back]
write_back:
  sink: "{{default_sink}}"
  document_kind: brief
  properties:
    target: "{{inputs.pr_doc_id}}--review"
    source: agent
    purpose: "Code review brief"
  body_from: "{{compiled.body}}"
