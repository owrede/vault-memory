# Reference contract — person-dossier (CON-07; replaces code-review-brief).
# Compile a dossier for a person from their note + 2-hop linked context
# (projects they own, meetings they attended, decisions they drove).
# Anchored to evals/fixtures/v2-test-vault/people/alice-chen.md.
# See docs/v2/adr/006-task-contract-dsl.md §Decision 12.
version: 1
name: person-dossier
description: |
  Compile a dossier for a person from their note plus everything linked
  to it — projects they own, meetings they attended, decisions they drove.
  Output is a brief written into the briefs sink. Useful for onboarding,
  handoff prep, or quickly understanding who someone is and what they touch
  across the vault.
inputs:
  vault:
    type: string
    description: Name of the vault to compile the brief in (e.g. "my-vault").
  person_doc_id:
    $ref: "#/types/DocId"
    description: DocId of the person note (e.g. obsidian-fs://my-vault/people/...).
  context_hops:
    type: integer
    minimum: 1
    maximum: 2
    default: 2
    description: How many wikilink hops to follow out from the person note.
required: [vault, person_doc_id]
sources:
  default_source:
    handle: "obsidian-fs://test-vault"
    required: true
sinks:
  default_sink:
    handle: "_memory/_briefs"
    required: true
assembly:
  - as: person
    verb: read_note
    args:
      doc_id: "{{inputs.person_doc_id}}"
  - as: linked
    verb: expand
    args:
      seed_doc_ids: ["{{inputs.person_doc_id}}"]
      hops: "{{inputs.context_hops}}"
      direction: both
  - as: clustered
    verb: cluster
    args:
      seed_doc_ids: "{{linked.doc_ids}}"
      method: edge-community
  - as: compiled
    verb: compile_brief
    args:
      vault: "{{inputs.vault}}"
      target: "{{inputs.person_doc_id}}--dossier"
      source_doc_ids: "{{linked.doc_ids}}"
      purpose: "Person dossier"
      max_tokens: 3000
output_shape:
  type: object
  properties:
    steps:
      type: object
    write_back:
      type: object
      properties:
        doc_id:
          type: string
      required: [doc_id]
  required: [write_back]
write_back:
  sink: "{{default_sink}}"
  document_kind: brief
  properties:
    target: "{{inputs.person_doc_id}}--dossier"
    source: agent
    purpose: "Person dossier"
  body_from: "{{compiled.body}}"
