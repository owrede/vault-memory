# CON-08 eval — person-dossier contract against Atlas Robotics fixture.
# Anchored to people/alice-chen.md, which links out to projects, decisions,
# and other people (2-hop expand surface).
description: person-dossier contract against Atlas Robotics fixture
scenarios:
  - name: alice-chen-dossier
    contract: person-dossier
    inputs:
      vault: "test-vault"
      person_doc_id: "obsidian-fs://test-vault/people/alice-chen.md"
      context_hops: 2
    expected_output_shape:
      type: object
      properties:
        steps:
          type: object
        write_back:
          type: object
          properties:
            doc_id:
              type: string
          required: [doc_id]
      required: [write_back]
    expected_write_back:
      sink: "_memory/_briefs"
      properties_required: [target, source, purpose]
