name: publish to npm + GitHub release

# Triggers on push of any tag matching v*.*.* — typically the result of
# `git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z`. The workflow
# rebuilds dist/ on a clean Linux runner (so the tarball is reproducible),
# runs the test suite, publishes to npm with --access public, and then
# creates a GitHub Release using the matching CHANGELOG.md section as the
# release body. The latest dist-tag follows the highest semver, so users
# running `npm install -g @owrede/vault-memory` always get the most recent
# release.

on:
  push:
    tags:
      - 'v*.*.*'

# Skip in PR contexts entirely
permissions:
  contents: write   # required by softprops/action-gh-release to create releases
  id-token: write   # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION). Aborting publish."
            exit 1
          fi
          echo "Version matches: $PKG_VERSION"

      - name: Publish to npm
        # --access public: scoped packages default to private otherwise
        # --provenance: attaches signed provenance attestation (npm 9.5+)
        # NPM_TOKEN must be a granular access token with publish rights for
        # @owrede/vault-memory and bypass-2fa enabled — stored in repo secrets.
        #
        # dist-tag routing:
        #   - prerelease tags (v*-rc.*, v*-beta.*, v*-alpha.*) → publish under
        #     `next` dist-tag. Users get the prerelease only via an explicit
        #     `@next` or `@X.Y.Z-prerelease` pin; the default `latest` dist-tag
        #     stays on the most recent stable release.
        #   - stable tags (v*.*.*) → publish under the default `latest`
        #     dist-tag.
        run: |
          set -euo pipefail
          # Provenance opt-out: NPM_DISABLE_PROVENANCE=1 (set as a repo
          # variable or via a one-off workflow_dispatch input) skips the
          # --provenance flag. Used to recover from sigstore-attestation
          # orphan states where a prior failed publish wrote a sigstore
          # log entry but never landed the package version, leaving the
          # registry unable to accept a retry of that exact version.
          # Default: provenance ON for all publishes.
          PROVENANCE_FLAG="--provenance"
          if [ "${NPM_DISABLE_PROVENANCE:-0}" = "1" ]; then
            echo "::warning::NPM_DISABLE_PROVENANCE=1 — publishing WITHOUT sigstore provenance attestation"
            PROVENANCE_FLAG=""
          fi
          if [[ "${GITHUB_REF_NAME}" =~ -(rc|beta|alpha) ]]; then
            echo "Detected prerelease tag '${GITHUB_REF_NAME}' → publishing under 'next' dist-tag"
            npm publish --access public $PROVENANCE_FLAG --tag next
          else
            echo "Detected stable tag '${GITHUB_REF_NAME}' → publishing under default 'latest' dist-tag"
            npm publish --access public $PROVENANCE_FLAG
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DISABLE_PROVENANCE: ${{ vars.NPM_DISABLE_PROVENANCE || '0' }}

      - name: Extract CHANGELOG section for this tag
        # Reads CHANGELOG.md and writes the section for the matching version
        # (between the `## [X.Y.Z]` heading and the next `## [` heading) to
        # /tmp/release-notes.md. Falls back to a generic note if no section
        # is found, so the release still gets created.
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { in_section = 0 }
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "\\[" ver "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION — using fallback." >&2
            printf "Release v%s. See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n" \
              "$VERSION" "$GITHUB_REPOSITORY" > /tmp/release-notes.md
          fi

          echo "--- release notes preview ---" >&2
          head -20 /tmp/release-notes.md >&2

      - name: Build plugin tarball
        # Bundles the Obsidian plugin (Svelte + esbuild) and archives the
        # `plugin/` directory into a tarball named
        # `vault-memory-plugin-vX.Y.Z.tar.gz`. The tarball is attached to
        # the GitHub Release below so `skills/vm-install/setup.sh` (D-15 /
        # Phase 7 carryover from plan 07-11) can fetch it by predictable URL.
        #
        # NOTE: do NOT run `npm ci` inside plugin/. The repo declares
        # `"workspaces": ["plugin"]` at the root, which hoists workspace deps
        # (notably @modelcontextprotocol/sdk) to the root node_modules/. The
        # earlier "Install dependencies" step runs `npm ci` at the root,
        # which installs everything including the hoisted deps. A second
        # `cd plugin && npm ci` only installs the plugin's direct deps and
        # the SDK ends up unresolvable at esbuild time (surfaced by plan
        # 08-07's v2.0.0-rc.1 dry-run; see 08-07-SUMMARY.md for the audit).
        run: |
          set -euo pipefail
          cd plugin
          node esbuild.config.mjs production
          cd ..
          TARBALL="vault-memory-plugin-v${GITHUB_REF_NAME#v}.tar.gz"
          tar -czf "$TARBALL" -C plugin .
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Generate manifest.sha256
        # Checksum the plugin tarball so `vm-install` (Phase 7) can verify
        # the download. Manual MP4 screencast asset uploads are out of scope
        # for this workflow (D-14 / RESEARCH Open Q2 — uploaded post-workflow
        # via the GitHub Release UI).
        run: |
          set -euo pipefail
          shasum -a 256 "$TARBALL" > manifest.sha256
          cat manifest.sha256

      - name: Create GitHub Release
        # softprops/action-gh-release@v2 picks up the tag from GITHUB_REF and
        # uses the body_path file. make_latest=legacy means: the highest
        # semver tag (no pre-release suffix) becomes the "Latest" release on
        # the repo's main page. Pre-release tags (e.g. v1.1.0-beta.1) skip
        # the latest promotion automatically.
        # `prerelease` is set dynamically via fromJSON+contains so rc/beta/alpha
        # tags are flagged "Pre-release" in the GitHub UI. Without this the
        # action defaults to `false` regardless of tag suffix.
        # `files:` attaches the plugin tarball + checksum as Release assets.
        # MP4 screencast is uploaded manually post-workflow (D-14).
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          make_latest: legacy
          prerelease: ${{ contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-alpha.') }}
          files: |
            ${{ env.TARBALL }}
            manifest.sha256
