name: publish to npm + GitHub release

# Triggers on push of any tag matching v*.*.* — typically the result of
# `git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z`. The workflow
# rebuilds dist/ on a clean Linux runner (so the tarball is reproducible),
# runs the test suite, publishes to npm with --access public, and then
# creates a GitHub Release using the matching CHANGELOG.md section as the
# release body. The latest dist-tag follows the highest semver, so users
# running `npm install -g @owrede/vault-memory` always get the most recent
# release.

on:
  push:
    tags:
      - 'v*.*.*'

# Skip in PR contexts entirely
permissions:
  contents: write   # required by softprops/action-gh-release to create releases
  id-token: write   # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION). Aborting publish."
            exit 1
          fi
          echo "Version matches: $PKG_VERSION"

      - name: Publish to npm
        # --access public: scoped packages default to private otherwise
        # --provenance: attaches signed provenance attestation (npm 9.5+)
        # NPM_TOKEN must be a granular access token with publish rights for
        # @owrede/vault-memory and bypass-2fa enabled — stored in repo secrets.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract CHANGELOG section for this tag
        # Reads CHANGELOG.md and writes the section for the matching version
        # (between the `## [X.Y.Z]` heading and the next `## [` heading) to
        # /tmp/release-notes.md. Falls back to a generic note if no section
        # is found, so the release still gets created.
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { in_section = 0 }
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "\\[" ver "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION — using fallback." >&2
            printf "Release v%s. See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n" \
              "$VERSION" "$GITHUB_REPOSITORY" > /tmp/release-notes.md
          fi

          echo "--- release notes preview ---" >&2
          head -20 /tmp/release-notes.md >&2

      - name: Create GitHub Release
        # softprops/action-gh-release@v2 picks up the tag from GITHUB_REF and
        # uses the body_path file. make_latest=legacy means: the highest
        # semver tag (no pre-release suffix) becomes the "Latest" release on
        # the repo's main page. Pre-release tags (e.g. v1.1.0-beta.1) skip
        # the latest promotion automatically.
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          make_latest: legacy
