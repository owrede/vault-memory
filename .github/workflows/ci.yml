name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel previous runs on the same branch when a new push lands.
# Each PR / branch gets its own queue (no cross-branch cancellation).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, type-check, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported runtime range is engines.node ">=22 <26" (#14). Test the
        # floor (22) and one upper supported version (24). Node 26+ has no
        # better-sqlite3 prebuild for the new ABI — intentionally excluded.
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — needed for check-fixture-privacy.sh

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (shell + adapter-seam invariants + tsc + prettier)
        # lint:check chains: fixture-privacy → no-telemetry → lint-adapters (I-1..I-6 + C-1 + I-5b) → tsc --noEmit → prettier --check.
        run: npm run lint:check

      - name: Test (vitest — includes evals/v1-baseline)
        run: npm test

      - name: Baseline eval (v1 tools-list snapshot + per-tool floors)
        run: npm run eval:baseline

      - name: Build CLI (dist/cli.js for smoketest)
        run: npm run build

      - name: Smoketest (non-Claude MCP SDK Client against dist/cli.js)
        # Proves the "any MCP-aware agent" framing mechanically:
        # connects as `non-claude-smoketest`, asserts all 23 v1 tools
        # listed with non-empty descriptions, calls list_vaults, and
        # confirms unknown-tool errors surface as isError (A6).
        run: node scripts/smoketest-non-claude.mjs
        timeout-minutes: 5
